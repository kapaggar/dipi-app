openapi: 3.0.3
info:
  title: DIPI Staff API (Vertical 1)
  version: 0.1.0
  description: |
    Hybrid registrar contract. Status writes may be implemented as a façade
    over GET/POST /change-status/{id}?s=&l=&c=.
    Search is new JSON. Do not scrape /search-app.
    Attended is a thin a_attended write — not /app-update-attended
    (that endpoint requires room allotment).
servers:
  - url: https://{host}/staff
    variables:
      host:
        default: dipi.example.invalid
        description: Centre DIPI host, no production default in the APK

paths:
  /user/login:
    post:
      operationId: login
      summary: Drupal staff login (Services shape)
      x-todo-server: POST /api/user/login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Session established
          content:
            application/json:
              schema:
                type: object
                required: [sessid, session_name, token, user]
                properties:
                  sessid: { type: string }
                  session_name: { type: string }
                  token: { type: string, description: CSRF token }
                  user:
                    type: object
                    properties:
                      uid: { type: integer }
                      name: { type: string }

  /user/logout:
    post:
      operationId: logout
      x-todo-server: POST /api/user/logout
      responses:
        '200': { description: Logged out }

  /session:
    get:
      operationId: getSession
      x-todo-server: users + dh_user_center + user_access + variable_get mode_test
      responses:
        '200':
          description: Current staff session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  /centres/{centreId}/courses:
    get:
      operationId: listCourses
      x-todo-server: dh_course where c_center and c_deleted=0
      parameters:
        - $ref: '#/components/parameters/centreId'
        - name: upcoming
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Course' }

  /courses/{courseId}:
    get:
      operationId: getCourse
      x-todo-server: dh_course + dh_type_detail
      parameters:
        - $ref: '#/components/parameters/courseId'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '404': { description: Not found or not in user centres }

  /courses/{courseId}/applicants:
    get:
      operationId: listApplicants
      description: |
        New JSON worklist. Use search.inc WHERE builder + whitelist SELECT.
        Never return ae_*, a_aadhar, a_pancard, a_passport, a_voter_id.
      x-todo-server: search.inc applicant query (projection whitelist)
      parameters:
        - $ref: '#/components/parameters/courseId'
        - name: status
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Name, conf no, phone, or email
          schema: { type: string }
        - name: gender
          in: query
          schema: { type: string, enum: [M, F] }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [items, counts]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApplicantCard' }
                  nextCursor: { type: string, nullable: true }
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                    description: status → count for this course after gender filter

  /applicants/{applicantId}:
    get:
      operationId: getApplicant
      x-todo-server: dh_applicant public columns only
      parameters:
        - $ref: '#/components/parameters/applicantId'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicantCard' }
        '403': { description: Other centre or other gender }

  /applicants/{applicantId}/status:
    post:
      operationId: changeStatus
      description: |
        Façade over _change_status. Query equivalent s, l, c.
        Letter send is a black box. Do not send s=Approved in v1 UI.
      x-todo-server: _change_status / _update_status / update_status_external / dh_send_letter
      parameters:
        - $ref: '#/components/parameters/applicantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string }
                letterId: { type: integer, default: 0 }
                comment: { type: string }
                sendLetter: { type: boolean, default: true }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChangeResult' }
        '409': { description: Course finalized or LC preconditions failed }

  /applicants/{applicantId}/attended:
    post:
      operationId: setAttended
      description: |
        Thin write of a_attended only. Not /app-update-attended
        (that requires aa_section / aa_acco before course start).
      x-todo-server: db_update dh_applicant.a_attended only
      parameters:
        - $ref: '#/components/parameters/applicantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attended]
              properties:
                attended: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [ok, attended]
                properties:
                  ok: { type: boolean }
                  attended: { type: boolean }
                  message: { type: string }
        '409': { description: Course finalized }

  /meta/statuses:
    get:
      operationId: listStatuses
      x-todo-server: dh_type_detail COURSE-SYSTEM-STATUS and COURSE-STATUS
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [value]
                      properties:
                        key: { type: string }
                        value: { type: string }

components:
  parameters:
    centreId:
      name: centreId
      in: path
      required: true
      schema: { type: integer }
    courseId:
      name: courseId
      in: path
      required: true
      schema: { type: integer }
    applicantId:
      name: applicantId
      in: path
      required: true
      schema: { type: integer }

  securitySchemes:
    drupalSession:
      type: apiKey
      in: cookie
      name: SESS*
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

  schemas:
    Session:
      type: object
      required: [uid, name, permissions, genderAccess, centres, modeTest]
      properties:
        uid: { type: integer }
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
        genderAccess:
          type: string
          enum: [male, female, both, none]
        centres:
          type: array
          items: { $ref: '#/components/schemas/Centre' }
        modeTest: { type: boolean }

    Centre:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    Course:
      type: object
      required: [id, centreId, name, finalized]
      properties:
        id: { type: integer }
        centreId: { type: integer }
        name: { type: string }
        start: { type: string, format: date }
        end: { type: string, format: date }
        finalized: { type: boolean }
        typeKey: { type: string }
        typeGroup: { type: string, description: "td_val3 e.g. LC, teen, child" }

    ApplicantCard:
      type: object
      required: [id, centreId, courseId, givenName, familyName, gender, status, type, oldStudent, attended]
      properties:
        id: { type: integer }
        centreId: { type: integer }
        courseId: { type: integer }
        givenName: { type: string }
        middleName: { type: string }
        familyName: { type: string }
        gender: { type: string, enum: [M, F] }
        status: { type: string }
        type: { type: string, enum: [Student, Sevak] }
        oldStudent: { type: boolean }
        attended: { type: boolean }
        confNo: { type: string, nullable: true }
        email: { type: string, nullable: true }
        mobile: { type: string, nullable: true }
        phoneHome: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        country: { type: string, nullable: true }
        dob: { type: string, format: date, nullable: true }
        age: { type: integer, nullable: true }
        alist: { type: boolean }
        monk: { type: boolean }
        createdAt: { type: string, format: date-time }

    StatusChangeResult:
      type: object
      required: [ok, status]
      properties:
        ok: { type: boolean }
        status: { type: string, description: Desk field out.status OK or Failed }
        message: { type: string }
        confNo: { type: string, nullable: true }
        newStatus: { type: string, nullable: true }

security:
  - drupalSession: []
    csrfToken: []
